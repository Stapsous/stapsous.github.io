<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12192b">
<meta name="robots" content="noindex">
<title>Pass-partout</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap" id="app">
  <div class="loading">Chargement…</div>
</div>

<div id="scan" role="dialog" aria-modal="true" aria-label="Code-barres">
  <img id="scan-img" alt="Code-barres de la carte d'embarquement">
  <div class="meta" id="scan-meta"></div>
  <button type="button" id="close-scan">Fermer</button>
</div>
<div class="toast" id="toast" role="status"></div>

<script type="module" src="app.js"></script>
</body>
</html>
